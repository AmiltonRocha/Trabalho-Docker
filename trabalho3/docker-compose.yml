version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: r00t
      MYSQL_DATABASE: wordpress
      MYSQL_USER: usr-wordpress
      MYSQL_PASSWORD: pwd-wordpress
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wpnet

  # Sem container_name: permite escalar com --scale wordpress=N
  wordpress:
    image: wordpress:5.4.2-php7.2-apache
    restart: always
    depends_on:
      - mysql
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: usr-wordpress
      WORDPRESS_DB_PASSWORD: pwd-wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./html:/var/www/html
    networks:
      - wpnet

  nginx:
    image: nginx:1.19.0
    container_name: nginx
    restart: always
    ports:
      # 8080 no host (a porta 80 fica livre para o Apache do XAMPP) e no
      # container, para o WordPress nao redirecionar o Locust para outra porta
      - "8080:8080"
    depends_on:
      - wordpress
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
    networks:
      - wpnet

  locust:
    image: grubykarol/locust
    container_name: locust
    ports:
      - "8089:8089"
    environment:
      ATTACKED_HOST: http://nginx:8080
      LOCUST_FILE: locustfile.py
      LOCUST_OPTS: ""
    volumes:
      - ./locust:/locust
    depends_on:
      - nginx
    networks:
      - wpnet

volumes:
  db_data:

networks:
  wpnet:
