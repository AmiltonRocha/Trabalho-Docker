events {
    worker_connections 1024;
}

http {
    # permite uploads de ate 10MB (posts com imagens de teste / midias)
    client_max_body_size 10m;

    upstream wordpress_cluster {
        # Nome do serviço "wordpress" no docker-compose.
        # O DNS do Docker resolve para TODAS as instâncias escaladas
        # (ex: --scale wordpress=3 -> 3 IPs no round-robin).
        # Reinicie o nginx após mudar a escala para re-resolver os IPs.
        server wordpress:80;
    }

    server {
        # 8080 tambem dentro da rede do Docker: o WordPress foi instalado em
        # http://localhost:8080 e redireciona quem chega por outra porta.
        # Assim o Locust (http://nginx:8080) e o navegador usam a mesma porta.
        listen 8080 default_server;
        listen [::]:8080 default_server;

        root /usr/share/nginx/html;
        index index.php;

        location / {
            add_header X-Upstream $upstream_addr;
            # $http_host mantem a porta (localhost:8080) para o WordPress
            # nao redirecionar para http://localhost sem porta
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://wordpress_cluster;
        }
    }
}
